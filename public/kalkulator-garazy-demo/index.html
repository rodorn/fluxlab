<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalkulator garaży, wiat i hal (demo)</title>
    <link rel="stylesheet" href="../kalkulator-pv-demo/calc-core.css" />
    <style>
      body {
        margin: 0;
        background: #fff;
      }
      .fx-calc {
        max-width: none;
        padding: 20px;
      }
      .fx-input {
        border-color: #d1d5db;
        border-radius: 8px;
        font-size: 16px;
      }
      .fx-input:focus {
        outline: 2px solid rgb(79 70 229 / 0.25);
        border-color: #4f46e5;
      }
      .fx-btn,
      .fx-btn-akcent {
        border-radius: 16px;
        padding: 14px 20px;
        font-size: 16px;
        letter-spacing: -0.01em;
        background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
        box-shadow: 0 6px 16px -6px rgb(79 70 229 / 0.55);
      }
      .fx-wynik {
        scroll-margin-top: 80px;
      }
      .fx-brama {
        background: #eef2ff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script src="../kalkulator-pv-demo/calc-core.js"></script>
    <script>
      function zaokr(x) {
        return Math.round(x / 100) * 100;
      }
      function widelki(a, b) {
        var f = function (x) {
          return FluxCalc.fmtNum(zaokr(x));
        };
        return f(a) + "–" + f(b) + " zł";
      }
      var KONFIG = {
        brand: {
          nazwa: "Przykładowa Firma Garaże i Hale",
          logo: "",
          kolor: "#4f46e5",
          kolorAkcent: "#16a34a",
          stopka:
            'Przykład: ceny i założenia demonstracyjne. Silnik: <a href="https://fluxlab.pl" target="_blank" rel="noopener">FluxLab</a>',
        },
        lead: {
          tryb: "demo",
          temat: "Zapytanie z kalkulatora garaży",
          tekst:
            "To demo: wpisz dowolny adres, nic nie zostanie wysłane. Odsłoni się rozbicie kosztów.",
          cta: "Pokaż rozbicie kosztów",
          komunikatHtml:
            'To tylko przykład: nic nie zostało wysłane. Chcesz taki kalkulator na swojej stronie? <a href="/kalkulator-garazy-demo#zamow" target="_top">Zamów, 10 dni gratis</a>.',
        },
        // Cena brutto za m² z transportem i montażem: [od, do], zależnie od powierzchni.
        progi: [
          { doM2: 30, m2: [260, 380], nazwa: "Garaż" },
          { doM2: 80, m2: [220, 320], nazwa: "Garaż wielostanowiskowy" },
          { doM2: Infinity, m2: [180, 280], nazwa: "Hala" },
        ],
        dach: [
          { nazwa: "Jednospadowy", mnoznik: 1 },
          { nazwa: "Dwuspadowy", mnoznik: 1.1 },
          { nazwa: "Dwuspadowy z blachodachówką", mnoznik: 1.22 },
        ],
        brama: [
          { nazwa: "Uchylna", cena: [900, 1500] },
          { nazwa: "Dwuskrzydłowa", cena: [700, 1200] },
          { nazwa: "Segmentowa z napędem", cena: [4500, 7500] },
          { nazwa: "Brak, wiata otwarta z boków", cena: [0, 0], wiata: 0.65 },
        ],
      };

      FluxCalc.init({
        mount: "#app",
        brand: KONFIG.brand,
        lead: KONFIG.lead,
        tytul: "Wycena garażu, wiaty lub hali",
        opis: "Podaj wymiary, rodzaj dachu i bramy. Zobaczysz orientacyjny koszt z transportem i montażem.",
        ctaOblicz: "Policz koszt",
        pola: [
          { id: "szer", etykieta: "Szerokość", typ: "number", wartosc: 3, min: 2, krok: 0.5, jednostka: "m" },
          { id: "dl", etykieta: "Długość", typ: "number", wartosc: 5, min: 2, krok: 0.5, jednostka: "m", pomoc: "Garaż na jedno auto: 3 × 5 m, na dwa: 6 × 5 m." },
          {
            id: "dach",
            etykieta: "Rodzaj dachu",
            typ: "select",
            wartosc: 1,
            opcje: KONFIG.dach.map(function (o, i) {
              return { wartosc: i, etykieta: o.nazwa };
            }),
          },
          {
            id: "brama",
            etykieta: "Brama",
            typ: "select",
            wartosc: 0,
            opcje: KONFIG.brama.map(function (o, i) {
              return { wartosc: i, etykieta: o.nazwa };
            }),
          },
        ],
        oblicz: function (v) {
          var pow = Math.max(0, (v.szer || 0) * (v.dl || 0));
          var p = KONFIG.progi.find(function (x) {
            return pow <= x.doM2;
          });
          var d = KONFIG.dach[v.dach] || KONFIG.dach[0];
          var b = KONFIG.brama[v.brama] || KONFIG.brama[0];
          var k = d.mnoznik * (b.wiata || 1);
          var bryla = [pow * p.m2[0] * k, pow * p.m2[1] * k];
          var razem = [bryla[0] + b.cena[0], bryla[1] + b.cena[1]];
          var nazwa = b.wiata ? "Wiata" : p.nazwa;
          return {
            podsumowanie: [
              { etykieta: "Koszt z montażem", tekst: widelki(razem[0], razem[1]), wyroznij: true },
              { etykieta: nazwa, tekst: FluxCalc.fmtNum(Math.round(pow * 10) / 10, "m²") },
            ],
            pelne: [
              { etykieta: nazwa + ", dach " + d.nazwa.toLowerCase(), tekst: widelki(bryla[0], bryla[1]) },
              { etykieta: "Cena za m²", tekst: Math.round(p.m2[0] * k) + "–" + Math.round(p.m2[1] * k) + " zł" },
              { etykieta: "Brama: " + b.nazwa.toLowerCase(), tekst: b.cena[1] ? widelki(b.cena[0], b.cena[1]) : "0 zł" },
              { etykieta: "Razem brutto", tekst: widelki(razem[0], razem[1]), wyroznij: true },
              { etykieta: "Fundament lub wylewka", tekst: "poza wyceną" },
            ],
          };
        },
      });
    </script>
  </body>
</html>
