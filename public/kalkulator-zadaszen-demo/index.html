<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalkulator zadaszeń tarasu i pergoli (demo)</title>
    <link rel="stylesheet" href="../kalkulator-pv-demo/calc-core.css" />
    <style>
      body {
        margin: 0;
        background: #fff;
      }
      .fx-calc {
        max-width: none;
        padding: 20px;
      }
      .fx-input {
        border-color: #d1d5db;
        border-radius: 8px;
        font-size: 16px;
      }
      .fx-input:focus {
        outline: 2px solid rgb(79 70 229 / 0.25);
        border-color: #4f46e5;
      }
      .fx-btn,
      .fx-btn-akcent {
        border-radius: 16px;
        padding: 14px 20px;
        font-size: 16px;
        letter-spacing: -0.01em;
        background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
        box-shadow: 0 6px 16px -6px rgb(79 70 229 / 0.55);
      }
      .fx-wynik {
        scroll-margin-top: 80px;
      }
      .fx-brama {
        background: #eef2ff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script src="../kalkulator-pv-demo/calc-core.js"></script>
    <script>
      function zaokr(x) {
        return Math.round(x / 100) * 100;
      }
      function widelki(a, b) {
        var f = function (x) {
          return FluxCalc.fmtNum(zaokr(x));
        };
        return f(a) + "–" + f(b) + " zł";
      }
var KONFIG = {
  brand: {
    nazwa: "Przykładowa Firma Zadaszenia i Pergole",
    logo: "",
    kolor: "#4f46e5",
    kolorAkcent: "#16a34a",
    stopka:
      'Przykład: ceny i założenia demonstracyjne. Silnik: <a href="https://fluxlab.pl" target="_blank" rel="noopener">FluxLab</a>',
  },
  lead: {
    tryb: "demo",
    temat: "Zapytanie z kalkulatora zadaszeń",
    tekst:
      "To demo: wpisz dowolny adres, nic nie zostanie wysłane. Odsłoni się rozbicie kosztów.",
    cta: "Pokaż rozbicie kosztów",
    komunikatHtml:
      'To tylko przykład: nic nie zostało wysłane. Chcesz taki kalkulator na swojej stronie? <a href="/kalkulator-zadaszen-demo#zamow" target="_top">Zamów, 10 dni gratis</a>.',
  },
  // Konstrukcja aluminiowa z pokryciem: cena brutto za m² z montażem, [od, do].
  pokrycie: [
    { nazwa: "Poliwęglan komorowy", m2: [650, 1000] },
    { nazwa: "Poliwęglan lity", m2: [800, 1200] },
    { nazwa: "Szkło bezpieczne VSG", m2: [1100, 1700] },
    { nazwa: "Lamele obrotowe (pergola bioklimatyczna)", m2: [1800, 2900] },
  ],
  montaz: [
    { nazwa: "Do ściany budynku", mnoznik: 1 },
    { nazwa: "Wolnostojące, na czterech słupach", mnoznik: 1.2 },
  ],
  // Mała powierzchnia: dojazd i montaż kosztują tyle samo.
  minimum: [6000, 9000],
};

FluxCalc.init({
  mount: "#app",
  brand: KONFIG.brand,
  lead: KONFIG.lead,
  tytul: "Wycena zadaszenia tarasu lub pergoli",
  opis: "Podaj wymiary, pokrycie i sposób montażu. Zobaczysz orientacyjny koszt z montażem.",
  ctaOblicz: "Policz koszt",
  pola: [
    {
      id: "szer",
      etykieta: "Szerokość",
      typ: "number",
      wartosc: 5,
      min: 1,
      krok: 0.5,
      jednostka: "m",
      pomoc: "Wzdłuż ściany domu albo dłuższy bok pergoli.",
    },
    {
      id: "gl",
      etykieta: "Głębokość (wysięg)",
      typ: "number",
      wartosc: 3,
      min: 1,
      krok: 0.5,
      jednostka: "m",
      pomoc: "Typowy taras: 3–4 m od ściany.",
    },
    {
      id: "pokrycie",
      etykieta: "Pokrycie dachu",
      typ: "select",
      wartosc: 0,
      opcje: KONFIG.pokrycie.map(function (o, i) {
        return { wartosc: i, etykieta: o.nazwa };
      }),
    },
    {
      id: "montaz",
      etykieta: "Montaż",
      typ: "select",
      wartosc: 0,
      opcje: KONFIG.montaz.map(function (o, i) {
        return { wartosc: i, etykieta: o.nazwa };
      }),
    },
  ],
  oblicz: function (v) {
    var pow = Math.max(0, (v.szer || 0) * (v.gl || 0));
    var p = KONFIG.pokrycie[v.pokrycie] || KONFIG.pokrycie[0];
    var m = KONFIG.montaz[v.montaz] || KONFIG.montaz[0];
    var razem = [
      Math.max(KONFIG.minimum[0], pow * p.m2[0] * m.mnoznik),
      Math.max(KONFIG.minimum[1], pow * p.m2[1] * m.mnoznik),
    ];
    var dni = pow > 25 || m.mnoznik > 1 ? "2–3 dni" : "1–2 dni";
    return {
      podsumowanie: [
        {
          etykieta: "Koszt z montażem",
          tekst: widelki(razem[0], razem[1]),
          wyroznij: true,
        },
        {
          etykieta: "Powierzchnia",
          tekst: FluxCalc.fmtNum(Math.round(pow * 10) / 10, "m²"),
        },
      ],
      pelne: [
        {
          etykieta: "Konstrukcja aluminiowa, " + p.nazwa.toLowerCase(),
          tekst: widelki(razem[0], razem[1]),
        },
        {
          etykieta: "Cena za m²",
          tekst:
            Math.round(p.m2[0] * m.mnoznik) +
            "–" +
            Math.round(p.m2[1] * m.mnoznik) +
            " zł",
        },
        {
          etykieta: "Montaż: " + m.nazwa.toLowerCase(),
          tekst: m.mnoznik > 1 ? "+20% za słupy i rynny" : "w cenie",
        },
        { etykieta: "Czas montażu", tekst: dni },
        {
          etykieta: "Razem brutto",
          tekst: widelki(razem[0], razem[1]),
          wyroznij: true,
        },
        { etykieta: "Fundamenty pod słupy", tekst: "poza wyceną" },
      ],
    };
  },
});
    </script>
  </body>
</html>
