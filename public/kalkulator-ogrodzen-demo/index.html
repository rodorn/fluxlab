<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalkulator ogrodzeń i bram (demo)</title>
    <link rel="stylesheet" href="../kalkulator-pv-demo/calc-core.css" />
    <style>
      body {
        margin: 0;
        background: #fff;
      }
      .fx-calc {
        max-width: none;
        padding: 20px;
      }
      .fx-input {
        border-color: #d1d5db;
        border-radius: 8px;
        font-size: 16px;
      }
      .fx-input:focus {
        outline: 2px solid rgb(79 70 229 / 0.25);
        border-color: #4f46e5;
      }
      .fx-btn,
      .fx-btn-akcent {
        border-radius: 16px;
        padding: 14px 20px;
        font-size: 16px;
        letter-spacing: -0.01em;
        background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
        box-shadow: 0 6px 16px -6px rgb(79 70 229 / 0.55);
      }
      .fx-wynik {
        scroll-margin-top: 80px;
      }
      .fx-brama {
        background: #eef2ff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script src="../kalkulator-pv-demo/calc-core.js"></script>
    <script>
      function zaokr(x) {
        return Math.round(x / 100) * 100;
      }
      function widelki(a, b) {
        var f = function (x) {
          return FluxCalc.fmtNum(zaokr(x));
        };
        return f(a) + "–" + f(b) + " zł";
      }
      var KONFIG = {
        brand: {
          nazwa: "Przykładowa Firma Ogrodzeniowa",
          logo: "",
          kolor: "#4f46e5",
          kolorAkcent: "#16a34a",
          stopka:
            'Przykład: ceny i założenia demonstracyjne. Silnik: <a href="https://fluxlab.pl" target="_blank" rel="noopener">FluxLab</a>',
        },
        lead: {
          tryb: "demo",
          temat: "Zapytanie z kalkulatora ogrodzeń",
          tekst:
            "To demo: wpisz dowolny adres, nic nie zostanie wysłane. Odsłoni się rozbicie kosztów.",
          cta: "Pokaż rozbicie kosztów",
          komunikatHtml:
            'To tylko przykład: nic nie zostało wysłane. Chcesz taki kalkulator na swojej stronie? <a href="/kalkulator-ogrodzen-demo#zamow" target="_top">Zamów, 10 dni gratis</a>.',
        },
        // Ceny brutto z montażem za metr bieżący: [od, do]. Firma wpisuje własne.
        ogrodzenie: [
          { nazwa: "Siatka pleciona", mb: [90, 140], dzienneMb: 60 },
          { nazwa: "Panel 3D ocynk + RAL", mb: [160, 240], dzienneMb: 40 },
          { nazwa: "Sztachety metalowe", mb: [380, 560], dzienneMb: 20 },
          { nazwa: "Gabion", mb: [700, 1100], dzienneMb: 10 },
        ],
        brama: [
          { nazwa: "Brak bramy", cena: [0, 0] },
          { nazwa: "Brama skrzydłowa 4 m", cena: [3500, 6500] },
          { nazwa: "Brama przesuwna 4 m z napędem", cena: [9000, 15000] },
        ],
      };

      FluxCalc.init({
        mount: "#app",
        brand: KONFIG.brand,
        lead: KONFIG.lead,
        tytul: "Wycena ogrodzenia i bramy",
        opis: "Podaj długość ogrodzenia, rodzaj i bramę. Zobaczysz orientacyjny koszt z montażem.",
        ctaOblicz: "Policz koszt",
        pola: [
          {
            id: "dlugosc",
            etykieta: "Długość ogrodzenia",
            typ: "number",
            wartosc: 40,
            min: 1,
            krok: 1,
            jednostka: "m",
            pomoc: "Bez szerokości bramy. Działka 20 × 30 m od frontu i boków to ok. 80 m.",
          },
          {
            id: "rodzaj",
            etykieta: "Rodzaj ogrodzenia",
            typ: "select",
            wartosc: 1,
            opcje: KONFIG.ogrodzenie.map(function (o, i) {
              return { wartosc: i, etykieta: o.nazwa };
            }),
          },
          {
            id: "brama",
            etykieta: "Brama",
            typ: "select",
            wartosc: 1,
            opcje: KONFIG.brama.map(function (o, i) {
              return { wartosc: i, etykieta: o.nazwa };
            }),
          },
        ],
        oblicz: function (v) {
          var o = KONFIG.ogrodzenie[v.rodzaj] || KONFIG.ogrodzenie[0];
          var b = KONFIG.brama[v.brama] || KONFIG.brama[0];
          var m = Math.max(0, v.dlugosc || 0);
          var og = [m * o.mb[0], m * o.mb[1]];
          var razem = [og[0] + b.cena[0], og[1] + b.cena[1]];
          var dni = Math.max(1, Math.ceil(m / o.dzienneMb) + (b.cena[1] ? 1 : 0));
          return {
            podsumowanie: [
              { etykieta: "Koszt z montażem", tekst: widelki(razem[0], razem[1]), wyroznij: true },
              { etykieta: "Montaż", tekst: dni === 1 ? "ok. 1 dzień" : "ok. " + dni + " dni" },
            ],
            pelne: [
              { etykieta: o.nazwa + ", " + m + " m", tekst: widelki(og[0], og[1]) },
              { etykieta: "Cena za metr", tekst: o.mb[0] + "–" + o.mb[1] + " zł" },
              { etykieta: b.nazwa, tekst: b.cena[1] ? widelki(b.cena[0], b.cena[1]) : "0 zł" },
              { etykieta: "Razem brutto", tekst: widelki(razem[0], razem[1]), wyroznij: true },
            ],
          };
        },
      });
    </script>
  </body>
</html>
