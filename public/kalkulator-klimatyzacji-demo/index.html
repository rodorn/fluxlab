<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalkulator klimatyzacji (demo)</title>
    <link rel="stylesheet" href="../kalkulator-pv-demo/calc-core.css" />
    <style>
      body {
        margin: 0;
        background: #fff;
      }
      .fx-calc {
        max-width: none;
        padding: 20px;
      }
      .fx-input {
        border-color: #d1d5db;
        border-radius: 8px;
        font-size: 16px;
      }
      .fx-input:focus {
        outline: 2px solid rgb(79 70 229 / 0.25);
        border-color: #4f46e5;
      }
      .fx-btn,
      .fx-btn-akcent {
        border-radius: 16px;
        padding: 14px 20px;
        font-size: 16px;
        letter-spacing: -0.01em;
        background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
        box-shadow: 0 6px 16px -6px rgb(79 70 229 / 0.55);
      }
      .fx-wynik {
        scroll-margin-top: 80px;
      }
      .fx-brama {
        background: #eef2ff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script src="../kalkulator-pv-demo/calc-core.js"></script>
    <script>
      function zaokr(x) {
        return Math.round(x / 100) * 100;
      }
      function widelki(a, b) {
        var f = function (x) {
          return FluxCalc.fmtNum(zaokr(x));
        };
        return f(a) + "–" + f(b) + " zł";
      }
      var KONFIG = {
        brand: {
          nazwa: "Przykładowa Firma Klimatyzacja",
          logo: "",
          kolor: "#4f46e5",
          kolorAkcent: "#16a34a",
          stopka:
            'Przykład: ceny i założenia demonstracyjne. Silnik: <a href="https://fluxlab.pl" target="_blank" rel="noopener">FluxLab</a>',
        },
        lead: {
          tryb: "demo",
          temat: "Zapytanie z kalkulatora klimatyzacji",
          tekst:
            "To demo: wpisz dowolny adres, nic nie zostanie wysłane. Odsłoni się dobór urządzeń i koszt prądu.",
          cta: "Pokaż dobór i koszt prądu",
          komunikatHtml:
            'To tylko przykład: nic nie zostało wysłane. Chcesz taki kalkulator na swojej stronie? <a href="/kalkulator-klimatyzacji-demo#zamow" target="_top">Zamów, 10 dni gratis</a>.',
        },
        // Cena brutto jednostki wewnętrznej z montażem (split albo udział w multi-split): [od, do].
        jednostka: [3800, 5800],
        duzaJednostka: 1.15, // pomieszczenie powyżej 35 m²
        tryb: [
          { nazwa: "Tylko chłodzenie", mnoznik: 1, wPm2: 100 },
          { nazwa: "Chłodzenie i dogrzewanie", mnoznik: 1.1, wPm2: 100 },
          { nazwa: "Grzanie jako główne źródło", mnoznik: 1.35, wPm2: 110 },
        ],
        cenaPradu: 1.1, // zł/kWh brutto
        godzinyChlodzenia: 350,
        seer: 6.1,
        scop: 4.0,
        grzanieKWhNaM2: { dogrzewanie: 25, glowne: 90 },
      };

      FluxCalc.init({
        mount: "#app",
        brand: KONFIG.brand,
        lead: KONFIG.lead,
        tytul: "Wycena klimatyzacji i pompy powietrze-powietrze",
        opis: "Podaj liczbę pomieszczeń, metraż i do czego ma służyć. Zobaczysz orientacyjny koszt z montażem i roczny koszt prądu.",
        ctaOblicz: "Policz koszt",
        pola: [
          { id: "pokoje", etykieta: "Liczba pomieszczeń", typ: "number", wartosc: 2, min: 1, max: 8, krok: 1 },
          { id: "metraz", etykieta: "Łączny metraż tych pomieszczeń", typ: "number", wartosc: 45, min: 5, krok: 1, jednostka: "m²" },
          {
            id: "tryb",
            etykieta: "Chłodzenie czy też grzanie",
            typ: "select",
            wartosc: 1,
            opcje: KONFIG.tryb.map(function (o, i) {
              return { wartosc: i, etykieta: o.nazwa };
            }),
          },
        ],
        oblicz: function (v) {
          var n = Math.min(8, Math.max(1, Math.round(v.pokoje || 1)));
          var m2 = Math.max(0, v.metraz || 0);
          var t = KONFIG.tryb[v.tryb] || KONFIG.tryb[0];
          var naPokoj = m2 / n;
          var k = t.mnoznik * (naPokoj > 35 ? KONFIG.duzaJednostka : 1);
          var koszt = [n * KONFIG.jednostka[0] * k, n * KONFIG.jednostka[1] * k];
          var moc = (m2 * t.wPm2) / 1000;
          var mocPokoj = Math.max(2.5, Math.ceil((moc / n) * 2) / 2);
          var kWh = (moc * KONFIG.godzinyChlodzenia) / KONFIG.seer;
          if (v.tryb === 1) kWh += (m2 * KONFIG.grzanieKWhNaM2.dogrzewanie) / KONFIG.scop;
          if (v.tryb === 2) kWh += (m2 * KONFIG.grzanieKWhNaM2.glowne) / KONFIG.scop;
          var uklad = n === 1 ? "1 split" : n <= 4 ? "multi-split, " + n + " jednostki wewnętrzne" : n + " jednostek: 2 agregaty multi-split";
          return {
            podsumowanie: [
              { etykieta: "Koszt z montażem", tekst: widelki(koszt[0], koszt[1]), wyroznij: true },
              { etykieta: "Moc chłodnicza łącznie", tekst: FluxCalc.fmtNum(Math.round(moc * 10) / 10, "kW") },
            ],
            pelne: [
              { etykieta: "Układ", tekst: uklad },
              { etykieta: "Jednostka na pomieszczenie", tekst: "ok. " + FluxCalc.fmtNum(mocPokoj, "kW") },
              { etykieta: "Tryb pracy", tekst: t.nazwa.toLowerCase() },
              { etykieta: "Prąd w roku", tekst: "ok. " + FluxCalc.fmtNum(zaokr(kWh), "kWh") },
              { etykieta: "Koszt prądu w roku", tekst: "ok. " + FluxCalc.fmtPLN(zaokr(kWh * KONFIG.cenaPradu)) },
              { etykieta: "Razem z montażem", tekst: widelki(koszt[0], koszt[1]), wyroznij: true },
            ],
          };
        },
      });
    </script>
  </body>
</html>
